<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Поддержать стрим</title>
  <style>
    :root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#302154;background:#fff8f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 12% 10%,#ffdce8 0,transparent 34%),radial-gradient(circle at 88% 15%,#dfd1ff 0,transparent 38%),radial-gradient(circle at 50% 100%,#fff0cf 0,transparent 36%),#fffaf8}.card{position:relative;width:min(640px,100%);padding:clamp(28px,7vw,58px);overflow:hidden;border:1px solid #e5dafa;border-radius:38px;background:#fffffff0;box-shadow:0 30px 100px #5d3b8226;backdrop-filter:blur(18px)}.card:after{content:"✦";position:absolute;right:34px;top:28px;color:#cdb7ff;font-size:28px}.heart{display:grid;width:68px;height:68px;place-items:center;border-radius:23px;background:linear-gradient(145deg,#a37cff,#7950e8);color:#fff;font-size:30px;box-shadow:0 14px 34px #8f64ff55}small{display:block;margin-top:26px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#7b58be}h1{margin:12px 0;font-size:clamp(36px,8vw,62px);line-height:1.02;letter-spacing:-.045em}p{color:#6c607b;line-height:1.65;font-weight:650}.label{margin:30px 0 0;color:#7950b8;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.links{display:grid;gap:12px;margin:12px 0 30px}.button{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-radius:19px;background:linear-gradient(135deg,#966cff,#7b50ec);color:#fff;text-decoration:none;font-weight:900;box-shadow:0 11px 28px #8f64ff3d;transition:transform .16s ease,box-shadow .16s ease}.button:hover{transform:translateY(-2px);box-shadow:0 16px 34px #8f64ff52}.arrow{font-size:20px}.error{padding:16px;border-radius:18px;background:#fff0e2;color:#8b3e35;font-weight:800}.fine{margin:0;padding:15px 17px;border-radius:18px;background:#f7f2ff;font-size:12px}noscript{font-weight:800}@media(max-width:520px){.card{border-radius:28px;padding:28px 22px}.card:after{right:22px}.button{padding:16px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">♥</div>
    <small>Kitsu Studio · поддержка автора</small>
    <h1 id="title">Поддержать стрим</h1>
    <p id="description">Загрузка страницы…</p>
    <p class="label">Выбери удобный сервис</p>
    <div class="links" id="links"></div>
    <p class="fine">Оплата, комиссии и возвраты обрабатываются выбранным сервисом. Kitsu Studio не запрашивает данные карты.</p>
    <noscript>Для открытия ссылки требуется JavaScript.</noscript>
  </main>
  <script>
    const providers={donatello:{name:"Donatello",host:"donatello.to",path:/^\/[A-Za-z0-9_-]+\/?$/},donationalerts:{name:"DonationAlerts",host:"www.donationalerts.com",path:/^\/r\/[A-Za-z0-9_-]+\/?$/},streamlabs:{name:"Streamlabs",host:"streamlabs.com",path:/^\/[A-Za-z0-9_-]+\/tip\/?$/}};
    function safeLink(link){try{const rule=providers[link.provider],url=new URL(link.url);return (link.label===undefined||(typeof link.label==="string"&&link.label.length<=60))&&(link.color===undefined||/^#[0-9a-fA-F]{6}$/.test(link.color))&&rule&&url.protocol==="https:"&&url.hostname===rule.host&&!url.search&&!url.hash&&!url.username&&!url.password&&rule.path.test(url.pathname)}catch{return false}}
    function fail(message){document.getElementById("description").textContent="";const box=document.getElementById("links");box.className="error";box.textContent=message}
    try{
      const encoded=location.hash.slice(1);if(!encoded||encoded.length>5000)throw Error("Ссылка поддержки повреждена.");
      const normalized=encoded.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(encoded.length/4)*4,"=");
      const bytes=Uint8Array.from(atob(normalized),c=>c.charCodeAt(0));const page=JSON.parse(new TextDecoder().decode(bytes));
      if(!page.enabled||typeof page.title!=="string"||page.title.length>80||typeof page.description!=="string"||page.description.length>500||!Array.isArray(page.links)||!page.links.length||page.links.length>3||!page.links.every(safeLink))throw Error("Страница поддержки недоступна.");
      for(const field of [page.background,page.panel,page.text_color,page.accent]){if(field!==undefined&&(typeof field!=="string"||!/^#[0-9a-fA-F]{6}$/.test(field)))throw Error("Некорректный цвет страницы.")}
      if((page.button_shape!==undefined&&!["rounded","pill","square"].includes(page.button_shape))||(page.button_layout!==undefined&&!["list","grid"].includes(page.button_layout))||(page.decoration!==undefined&&!["heart","star","cat","none"].includes(page.decoration)))throw Error("Некорректное оформление страницы.");
      const card=document.querySelector(".card");document.body.style.background=page.background||"#fffaf8";card.style.background=page.panel||"#ffffff";card.style.color=page.text_color||"#302154";card.style.overflowWrap="anywhere";
      card.querySelectorAll("p,small").forEach(node=>{node.style.color="inherit"});document.querySelector(".fine").style.background="transparent";
      const icon=document.querySelector(".heart");icon.textContent=({heart:"♥",star:"✦",cat:"ฅ^•ﻌ•^ฅ",none:""})[page.decoration||"heart"];icon.style.display=page.decoration==="none"?"none":"grid";icon.style.background=page.accent||"#8f64ff";icon.style.width="fit-content";icon.style.minWidth="68px";icon.style.padding="0 12px";
      document.getElementById("links").style.gridTemplateColumns=page.button_layout==="grid"&&page.links.length>1?"repeat(2,minmax(0,1fr))":"minmax(0,1fr)";
      document.title=page.title;document.getElementById("title").textContent=page.title;document.getElementById("description").textContent=page.description;
      const links=document.getElementById("links");page.links.forEach(link=>{const a=document.createElement("a");a.className="button";a.style.borderRadius=page.button_shape==="pill"?"999px":page.button_shape==="square"?"6px":"19px";a.style.minWidth="0";a.style.gap="8px";a.href=link.url;a.rel="noopener noreferrer";const name=document.createElement("span");name.textContent=link.label?.trim()||`Поддержать через ${providers[link.provider].name}`;a.title=providers[link.provider].name;a.style.overflowWrap="anywhere";const color=link.color||"#8f64ff";a.style.background=color;const rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16)/255).map(c=>c<=0.04045?c/12.92:((c+0.055)/1.055)**2.4);a.style.color=rgb[0]*0.2126+rgb[1]*0.7152+rgb[2]*0.0722>0.179?"#151020":"#ffffff";const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="↗";a.append(name,arrow);links.append(a)});
    }catch(error){fail(error instanceof Error?error.message:"Страница поддержки недоступна.")}
  </script>
</body>
</html>
